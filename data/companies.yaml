# Seed list of company job boards mapped to their ATS.
# The pipeline hits each board's public API directly — this is where "hidden"
# jobs live that never make it to LinkedIn.
#
# Slugs occasionally change; if a board returns nothing it is skipped silently.
# Add your own target companies here — this list is meant to grow.
#
# How to find a slug: open a company's careers page and look at the URL/network:
#   greenhouse -> boards.greenhouse.io/<slug>
#   lever      -> jobs.lever.co/<slug>
#   ashby      -> jobs.ashbyhq.com/<slug>
#   comeet     -> careers page network call has company/<uid>/positions?token=<token>

# Verified working slugs (probed live). Add more as you find them.
